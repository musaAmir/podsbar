<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F8F7F4;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F8F7F4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3.728"
        data-track-index="1"
      ></div>

      <div
        id="el-02-problem"
        class="scene"
        data-composition-id="02-problem"
        data-composition-src="compositions/frames/02-problem.html"
        data-start="3.728"
        data-duration="1.8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-glance"
        class="scene"
        data-composition-id="03-glance"
        data-composition-src="compositions/frames/03-glance.html"
        data-start="5.5280000000000005"
        data-duration="5.4"
        data-track-index="1"
      ></div>

      <div
        id="el-04-cta"
        class="scene"
        data-composition-id="04-cta"
        data-composition-src="compositions/frames/04-cta.html"
        data-start="10.928"
        data-duration="4.072"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music/b-jingle.wav"
        data-start="0"
        data-duration="15"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
